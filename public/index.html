<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMUTK FRESHY 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./images/logo.png">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #091054;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(84, 120, 255, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(255, 222, 66, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(17, 31, 162, 0.35);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(84, 120, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .gold-glow { 
            text-shadow: 0 0 12px rgba(255, 222, 66, 0.7), 0 0 24px rgba(84, 120, 255, 0.4); 
        }
        .hidden { display: none !important; }
        .input-dark { 
            background: rgba(9, 16, 84, 0.7); 
            border: 1px solid rgba(84, 120, 255, 0.4); 
            color: white; 
            transition: all 0.3s;
        }
        .input-dark:focus { 
            outline: none; 
            border-color: #FFDE42; 
            box-shadow: 0 0 12px rgba(255, 222, 66, 0.5); 
            transform: scale(1.02);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(9,16,84,0.6); }
        ::-webkit-scrollbar-thumb { background: #5478FF; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FFDE42; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="text-center mb-8 mt-2">
        <img src="images/logo.png" alt="RMUTK FRESHY 2026" class="mx-auto h-28 md:h-36 object-contain drop-shadow-[0_0_25px_rgba(255,222,66,0.4)] hover:scale-105 transition-transform duration-300">
        
        <div id="user-info" class="mt-4 text-sm text-gray-300 hidden">
            กำลังใช้งาน: <span id="current-role-display" class="font-bold text-[#FFDE42]"></span>
            <button onclick="logout()" class="ml-4 text-gray-300 hover:text-[#FFDE42] underline transition"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </header>

    <!-- Login Form -->
    <div id="login-section" class="max-w-md mx-auto glass-panel rounded-2xl p-8 border border-[#5478FF]/40">
        <h3 class="text-2xl font-semibold mb-6 text-center text-[#FFDE42] gold-glow">เข้าสู่ระบบ</h3>
        <div class="space-y-5">
            <div>
                <label class="block text-sm text-gray-300 mb-2 font-medium">เลือกผู้ใช้งาน</label>
                <!-- 🌟 สไตล์ Dropdown แบบใหม่หรูหรา -->
                <div class="relative">
                    <select id="login-role" class="w-full p-3.5 pr-10 rounded-xl input-dark text-white font-medium focus:ring-2 focus:ring-[#FFDE42] cursor-pointer shadow-lg appearance-none transition-all">
                        <option value="admin" class="bg-[#091054] text-white py-2">ผู้ดูแลระบบ (Admin)</option>
                        <option value="judge1" class="bg-[#091054] text-white py-2">กรรมการท่านที่ 1</option>
                        <option value="judge2" class="bg-[#091054] text-white py-2">กรรมการท่านที่ 2</option>
                        <option value="judge3" class="bg-[#091054] text-white py-2">กรรมการท่านที่ 3</option>
                        <option value="judge4" class="bg-[#091054] text-white py-2">กรรมการท่านที่ 4</option>
                        <option value="judge5" class="bg-[#091054] text-white py-2">กรรมการท่านที่ 5</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-[#FFDE42]">
                        <i class="fas fa-chevron-down text-sm"></i>
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2 font-medium">รหัสผ่าน (PIN)</label>
                <input type="password" id="login-password" class="w-full p-3.5 rounded-xl input-dark focus:ring-2 focus:ring-[#FFDE42]" placeholder="กรอกรหัสผ่าน...">
            </div>
            <button onclick="attemptLogin()" class="w-full py-3.5 mt-2 rounded-xl bg-gradient-to-r from-[#FFDE42] via-yellow-300 to-[#FFDE42] text-[#111FA2] font-bold text-lg hover:shadow-[0_0_25px_rgba(255,222,66,0.7)] transition-all transform hover:scale-[1.01] active:scale-95">
                เข้าสู่ระบบ <i class="fas fa-arrow-right ml-2"></i>
            </button>
            <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
        </div>
    </div>

    <!-- Judge Dashboard -->
    <div id="judge-section" class="max-w-7xl mx-auto hidden">
        <div class="flex flex-wrap justify-center gap-3 md:gap-4 mb-10">
            <button onclick="switchCategory('mister')" id="tab-mister" class="px-6 py-2 rounded-full glass-panel border-2 border-transparent text-gray-300 font-semibold transition-all">Mister</button>
            <button onclick="switchCategory('miss')" id="tab-miss" class="px-6 py-2 rounded-full glass-panel border-2 border-transparent text-gray-300 font-semibold transition-all">Miss</button>
            <button onclick="switchCategory('queen')" id="tab-queen" class="px-6 py-2 rounded-full glass-panel border-2 border-transparent text-gray-300 font-semibold transition-all">Miss Queen</button>
            <button onclick="switchCategory('congeniality')" id="tab-congeniality" class="px-6 py-2 rounded-full glass-panel border-2 border-transparent text-gray-300 font-semibold transition-all">Miss Congeniality</button>
            <button onclick="switchCategory('jumbo')" id="tab-jumbo" class="px-6 py-2 rounded-full glass-panel border-2 border-transparent text-gray-300 font-semibold transition-all">Miss Jumbo</button>
        </div>

        <div id="contestants-container" class="grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-section" class="max-w-7xl mx-auto hidden">
        <div class="glass-panel rounded-2xl p-6 mb-8 overflow-x-auto border border-[#5478FF]/30">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-[#FFDE42] gold-glow"><i class="fas fa-chart-bar mr-2"></i> สรุปคะแนนรวม</h3>
                <button onclick="fetchScores()" class="px-4 py-2 bg-[#5478FF] hover:bg-blue-400 text-white font-bold transition-all rounded-lg shadow-md"><i class="fas fa-sync-alt"></i> อัปเดตล่าสุด</button>
            </div>
            <table class="w-full text-sm text-left text-gray-200">
                <thead class="text-xs text-[#111FA2] uppercase bg-[#FFDE42] font-bold">
                    <tr>
                        <th class="px-4 py-3 rounded-tl-lg">รหัส</th>
                        <th class="px-4 py-3">ชื่อ-นามสกุล</th>
                        <th class="px-4 py-3 text-center">ก.1</th>
                        <th class="px-4 py-3 text-center">ก.2</th>
                        <th class="px-4 py-3 text-center">ก.3</th>
                        <th class="px-4 py-3 text-center">ก.4</th>
                        <th class="px-4 py-3 text-center">ก.5</th>
                        <th class="px-4 py-3 text-center font-bold text-base rounded-tr-lg">รวม</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 🌟 Custom Warning & Confirmation Modal (ป๊อปอัปยืนยันหรูหรา) -->
    <div id="custom-confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <div class="glass-panel max-w-md w-full rounded-2xl p-6 border-2 border-[#FFDE42] shadow-[0_0_40px_rgba(255,222,66,0.35)] transform transition-all text-center relative">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-[#111FA2] border-2 border-[#FFDE42] flex items-center justify-center shadow-[0_0_20px_rgba(255,222,66,0.5)]">
                <i class="fas fa-exclamation-triangle text-2xl text-[#FFDE42] gold-glow"></i>
            </div>
            
            <h3 class="text-2xl font-bold text-[#FFDE42] gold-glow mb-2">ยืนยันการบันทึกคะแนน</h3>
            <p class="text-gray-300 text-sm mb-4">โปรดตรวจสอบความถูกต้องก่อนยืนยัน</p>

            <div class="bg-[#091054]/80 p-4 rounded-xl border border-[#5478FF]/30 text-left mb-5 space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-gray-400">ผู้แข่งขัน:</span>
                    <span id="modal-cname" class="font-bold text-white"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">รหัสประจำตัว:</span>
                    <span id="modal-cid" class="font-bold text-[#FFDE42]"></span>
                </div>
                <div class="flex justify-between border-t border-[#5478FF]/20 pt-2">
                    <span class="text-gray-300 font-medium">คะแนนรวมสุทธิ:</span>
                    <span class="font-bold text-[#FFDE42] text-lg"><span id="modal-score">0</span> / 100</span>
                </div>
            </div>

            <div class="p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-300 text-xs text-center mb-6">
                <i class="fas fa-lock mr-1"></i> เมื่อกดบันทึกแล้ว จะไม่สามารถแก้ไขคะแนนได้อีก
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl border border-gray-500 text-gray-300 hover:bg-gray-800 transition-all font-semibold">
                    ยกเลิก
                </button>
                <button onclick="confirmSubmitScore()" class="w-1/2 py-2.5 rounded-xl bg-gradient-to-r from-[#FFDE42] via-yellow-300 to-[#FFDE42] text-[#111FA2] font-bold shadow-[0_0_15px_rgba(255,222,66,0.5)] hover:scale-105 transition-all">
                    บันทึกคะแนน
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-500 bg-[#FFDE42] border-l-4 border-[#111FA2] text-[#111FA2] font-bold px-6 py-4 rounded shadow-[0_0_20px_rgba(255,222,66,0.6)] z-50 flex items-center">
        <i class="fas fa-check-circle mr-3 text-xl"></i> <span id="toast-msg"></span>
    </div>

    <script>
        let currentUser = null;
        let sessionToken = null;
        let heartbeatInterval = null;
        let pollingInterval = null;
        let currentCategory = 'mister';
        let allScores = [];
        let pendingSubmitContestantId = null;

        const contestants = {
            mister: [
                { id: 'M1', name: 'นายกฤษกร นภาสิริ' },
                { id: 'M2', name: 'นายธนพล สุวรรณเวช' },
                { id: 'M3', name: 'นายพงศกร วงศ์ชัย' }
            ],
            miss: [
                { id: 'W1', name: 'นางสาวณัฐชา อรุณสวัสดิ์' },
                { id: 'W2', name: 'นางสาวพิมพ์ลภัส ใจดี' },
                { id: 'W3', name: 'นางสาววิลาวัณย์ ทองคำ' }
            ],
            queen: [
                { id: 'Q1', name: 'พชรมนต์ จันทราทิพย์' },
                { id: 'Q2', name: 'ณัชชารีย์ สิริพงศ์' },
                { id: 'Q3', name: 'ธัญญลักษณ์ วิเศษศรี' }
            ],
            congeniality: [
                { id: 'MC1', name: 'นางสาวปรียาภรณ์ ชัยชนะ' },
                { id: 'MC2', name: 'นายณัฐพงศ์ ศรีสุข' },
                { id: 'MC3', name: 'นางสาวศศิธร มงคล' }
            ],
            jumbo: [
                { id: 'MJ1', name: 'นางสาวสุดารัตน์ สมบูรณ์' },
                { id: 'MJ2', name: 'นายอรุณเดช ชัยพร' },
                { id: 'MJ3', name: 'นางสาวชลธิชา บุญมี' }
            ]
        };

        const criteria = [
            { id: 'intro', name: 'แนะนำตัว', max: 10 },
            { id: 'theme', name: 'ชุดธีม', max: 20 },
            { id: 'speech', name: 'Speech 1 Min', max: 20 },
            { id: 'formal', name: 'เดินชุดพิธีการ', max: 20 },
            { id: 'qa', name: 'ตอบคำถาม', max: 30 }
        ];

        const allCategories = ['mister', 'miss', 'queen', 'congeniality', 'jumbo'];

        async function attemptLogin() {
            const role = document.getElementById('login-role').value;
            const password = document.getElementById('login-password').value;
            const errLabel = document.getElementById('login-error');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data.role;
                    sessionToken = data.token;
                    errLabel.classList.add('hidden');
                    
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('user-info').classList.remove('hidden');
                    document.getElementById('current-role-display').innerText = role.toUpperCase();

                    startHeartbeat();

                    if (role === 'admin') {
                        document.getElementById('admin-section').classList.remove('hidden');
                        fetchScores();
                        pollingInterval = setInterval(fetchScores, 3000);
                    } else {
                        document.getElementById('judge-section').classList.remove('hidden');
                        switchCategory('mister');
                    }
                } else {
                    errLabel.innerText = data.message;
                    errLabel.classList.remove('hidden');
                }
            } catch (e) {
                alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
            }
        }

        function startHeartbeat() {
            heartbeatInterval = setInterval(async () => {
                try {
                    const res = await fetch('/api/ping', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role: currentUser, token: sessionToken })
                    });
                    const data = await res.json();
                    if (!data.success) { forceLogout(); }
                } catch (e) {}
            }, 5000);
        }

        async function logout() {
            await fetch('/api/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: currentUser, token: sessionToken })
            });
            forceLogout();
        }

        function forceLogout() {
            clearInterval(heartbeatInterval);
            clearInterval(pollingInterval);
            currentUser = null;
            sessionToken = null;
            document.getElementById('login-password').value = '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('judge-section').classList.add('hidden');
            document.getElementById('admin-section').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
        }

        async function fetchScores() {
            try {
                const res = await fetch('/api/scores');
                const data = await res.json();
                if (Array.isArray(data)) {
                    allScores = data;
                } else {
                    allScores = [];
                }
                if(currentUser === 'admin') renderAdminTable();
            } catch (error) {
                allScores = [];
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            
            const baseClass = "px-6 py-2 rounded-full glass-panel border-2 border-transparent text-gray-300 font-semibold transition-all duration-300 hover:border-[#5478FF] hover:text-white";
            const activeClass = "px-6 py-2 rounded-full glass-panel border-2 border-[#FFDE42] text-[#FFDE42] font-bold bg-[#111FA2]/60 transition-all duration-300 scale-105 shadow-[0_0_15px_rgba(255,222,66,0.3)]";

            allCategories.forEach(c => {
                const el = document.getElementById(`tab-${c}`);
                if (el) el.className = (c === cat) ? activeClass : baseClass;
            });
            
            fetchScores().then(() => renderContestants());
        }

        function renderContestants() {
            const container = document.getElementById('contestants-container');
            container.innerHTML = '';
            
            contestants[currentCategory].forEach((contestant) => {
                const cId = contestant.id;
                const cName = contestant.name;
                const record = allScores.find(s => s.judge_id === currentUser && s.contestant_id === cId);
                const hasVoted = !!record;
                
                const score = record || { score_intro: 0, score_theme: 0, score_speech: 0, score_formal: 0, score_qa: 0 };
                let total = (score.score_intro || 0) + (score.score_theme || 0) + (score.score_speech || 0) + (score.score_formal || 0) + (score.score_qa || 0);

                const disabledAttr = hasVoted ? 'disabled' : '';
                const disabledInputClass = hasVoted ? 'opacity-60 cursor-not-allowed bg-gray-900/80 border-gray-600 text-gray-300' : 'input-dark';

                const btnStyle = hasVoted 
                    ? 'bg-gray-800/80 border border-gray-600 text-gray-400 cursor-not-allowed opacity-80' 
                    : 'bg-gradient-to-r from-[#FFDE42] via-yellow-300 to-[#FFDE42] text-[#111FA2] hover:shadow-[0_0_20px_rgba(255,222,66,0.6)] hover:scale-[1.02] active:scale-95';
                const btnIcon = hasVoted ? 'fa-lock' : 'fa-crown';
                const btnText = hasVoted ? 'บันทึกเรียบร้อยแล้ว' : 'บันทึกคะแนน';

                let html = `
                    <div class="glass-panel p-6 rounded-2xl border-t-2 ${hasVoted ? 'border-gray-500' : 'border-[#FFDE42]'} relative transition-all duration-300 hover:shadow-[0_15px_40px_rgba(84,120,255,0.3)] hover:-translate-y-1 flex flex-col md:flex-row gap-6 items-center md:items-stretch">
                        
                        <div class="w-full md:w-5/12 flex flex-col items-center text-center justify-between border-b md:border-b-0 md:border-r border-[#5478FF]/30 pb-6 md:pb-0 md:pr-6">
                            <div class="w-full flex flex-col items-center">
                                
                                <div class="relative w-full h-64 md:h-72 rounded-xl overflow-hidden border-2 ${hasVoted ? 'border-green-400/80' : 'border-[#FFDE42]'} bg-[#111FA2] shadow-[0_0_20px_rgba(255,222,66,0.25)] group mb-3">
                                    <img src="images/contestants/${cId}.jpg" 
                                         onerror="this.onerror=null; this.src='https://placehold.co/400x500/111FA2/FFDE42?text=${cId}';" 
                                         alt="${cName}" 
                                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    
                                    <div class="absolute top-2 left-2 bg-[#111FA2]/90 border border-[#FFDE42] text-[#FFDE42] font-bold px-3 py-1 rounded-lg text-sm shadow-md">
                                        ${cId}
                                    </div>

                                    ${hasVoted ? '<div class="absolute top-2 right-2 bg-green-600 border border-green-300 text-white font-bold text-xs px-2.5 py-1 rounded-lg shadow-md flex items-center gap-1"><i class="fas fa-lock text-xs"></i> ส่งแล้ว</div>' : ''}
                                </div>

                                <h4 class="text-lg font-bold text-white tracking-wide mt-1">${cName}</h4>
                                <div class="mt-2 px-4 py-1.5 bg-[#111FA2]/80 rounded-full text-[#FFDE42] font-bold text-sm border border-[#5478FF]/40">
                                    รวม <span id="total-${cId}" class="text-xl ml-1">${total}</span> / 100
                                </div>
                            </div>

                            <button onclick="submitScore('${cId}')" ${disabledAttr} class="w-full mt-4 py-2.5 rounded-xl font-bold transition-all duration-300 transform ${btnStyle}">
                                <i class="fas ${btnIcon} mr-2"></i> ${btnText}
                            </button>
                        </div>
                        
                        <div class="w-full md:w-7/12 space-y-3 bg-[#091054]/60 p-4 rounded-xl border border-[#5478FF]/20 flex flex-col justify-center">
                `;

                criteria.forEach(crit => {
                    let val = score[`score_${crit.id}`] || 0;
                    html += `
                            <div class="flex justify-between items-center group">
                                <div class="flex flex-col transition-transform duration-300 ${hasVoted ? '' : 'group-hover:translate-x-1'}">
                                    <span class="text-sm font-medium text-gray-200 ${hasVoted ? '' : 'group-hover:text-[#FFDE42]'} transition-colors">${crit.name}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <input type="number" min="0" max="${crit.max}" value="${val}" id="${crit.id}-${cId}" ${disabledAttr} 
                                        class="w-16 h-9 ${disabledInputClass} rounded-lg text-center font-bold text-[#FFDE42]" 
                                        onchange="updateTotal('${cId}', this, ${crit.max})">
                                    <span class="text-xs text-gray-400 w-8">/${crit.max}</span>
                                </div>
                            </div>
                    `;
                });

                html += `
                        </div>
                    </div>`;
                container.innerHTML += html;
            });
        }

        function updateTotal(cId, input, max) {
            let val = parseInt(input.value) || 0;
            if (val > max) input.value = max;
            if (val < 0) input.value = 0;
            let sum = 0;
            criteria.forEach(crit => {
                sum += parseInt(document.getElementById(`${crit.id}-${cId}`).value) || 0;
            });
            
            const totalEl = document.getElementById(`total-${cId}`);
            totalEl.innerText = sum;
            
            totalEl.parentElement.classList.add('scale-110', 'bg-[#5478FF]/40');
            setTimeout(() => totalEl.parentElement.classList.remove('scale-110', 'bg-[#5478FF]/40'), 200);
        }

        // 🌟 เรียกเปิด Custom Modal แทนการใช้ confirm แบบเก่า
        function submitScore(cId) {
            let sum = 0;
            criteria.forEach(crit => {
                sum += parseInt(document.getElementById(`${crit.id}-${cId}`).value) || 0;
            });

            const contestant = contestants[currentCategory].find(c => c.id === cId);
            const cName = contestant ? contestant.name : '';

            document.getElementById('modal-cid').innerText = cId;
            document.getElementById('modal-cname').innerText = cName;
            document.getElementById('modal-score').innerText = sum;

            pendingSubmitContestantId = cId;
            document.getElementById('custom-confirm-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            pendingSubmitContestantId = null;
        }

        async function confirmSubmitScore() {
            if (!pendingSubmitContestantId) return;
            const cId = pendingSubmitContestantId;
            closeModal();

            const scores = {
                intro: parseInt(document.getElementById(`intro-${cId}`).value) || 0,
                theme: parseInt(document.getElementById(`theme-${cId}`).value) || 0,
                speech: parseInt(document.getElementById(`speech-${cId}`).value) || 0,
                formal: parseInt(document.getElementById(`formal-${cId}`).value) || 0,
                qa: parseInt(document.getElementById(`qa-${cId}`).value) || 0
            };

            await fetch('/api/scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ judge_id: currentUser, contestant_id: cId, scores })
            });
            
            document.getElementById('toast-msg').innerText = `บันทึกคะแนนรหัส ${cId} เรียบร้อยแล้ว (ล็อกคะแนนแล้ว)`;
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
            
            await fetchScores();
            renderContestants();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = '';
            
            const allContestants = [
                ...contestants.mister, 
                ...contestants.miss, 
                ...contestants.queen,
                ...contestants.congeniality,
                ...contestants.jumbo
            ];
            
            allContestants.forEach(c => {
                let rowHtml = `
                    <tr class="border-b border-[#5478FF]/20 hover:bg-[#5478FF]/10 transition-colors duration-300">
                        <td class="px-4 py-3 font-bold text-[#FFDE42]">${c.id}</td>
                        <td class="px-4 py-3 text-white min-w-[150px]">${c.name}</td>
                `;
                let total = 0;
                for(let i=1; i<=5; i++) {
                    const record = allScores.find(s => s.judge_id === `judge${i}` && s.contestant_id === c.id);
                    if(record) {
                        let sum = (record.score_intro || 0) + (record.score_theme || 0) + (record.score_speech || 0) + (record.score_formal || 0) + (record.score_qa || 0);
                        total += sum;
                        rowHtml += `<td class="px-4 py-3 text-center text-gray-200">${sum}</td>`;
                    } else {
                        rowHtml += `<td class="px-4 py-3 text-center text-gray-500">-</td>`;
                    }
                }
                rowHtml += `<td class="px-4 py-3 text-center font-bold text-[#FFDE42] text-lg bg-[#111FA2]/50">${total}</td></tr>`;
                tbody.innerHTML += rowHtml;
            });
        }
    </script>
</body>

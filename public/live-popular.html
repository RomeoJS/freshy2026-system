<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMUTK FRESHY 2026 - POPULAR VOTE STAGE CEREMONY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="shortcut icon" type="image/png" href="images/logo.png" />

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      box-sizing: border-box;
    }

    body {
      font-family: "Prompt", sans-serif;
      background-color: #050a30;
      background-image:
        radial-gradient(circle at 50% 10%, rgba(84, 120, 255, 0.38) 0%, transparent 60%),
        radial-gradient(circle at 10% 85%, rgba(244, 63, 94, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(255, 222, 66, 0.25) 0%, transparent 50%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .glass-panel {
      background: rgba(13, 24, 120, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(84, 120, 255, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    .gold-glow {
      text-shadow:
        0 0 15px rgba(255, 222, 66, 0.9),
        0 0 35px rgba(255, 180, 0, 0.6);
    }

    .pulse-live {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-ring 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes scoreFlash {
      0% { transform: scale(1); filter: brightness(1); }
      30% { transform: scale(1.08); filter: brightness(1.6) drop-shadow(0 0 25px rgba(255, 222, 66, 0.9)); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .score-updated {
      animation: scoreFlash 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      70% { opacity: 1; transform: scale(1.03) translateY(-5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-pop-in {
      animation: popIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseMystery {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 222, 66, 0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 45px rgba(255, 222, 66, 0.8)); }
    }

    .animate-mystery {
      animation: pulseMystery 2.5s infinite ease-in-out;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 select-none relative">

    <!-- Category Tabs Navigation Bar (ตามลำดับการประกาศผลบนเวที) -->

        <button onclick="setCategoryIndex(1)" id="cat-tab-queen"
          class="cat-tab px-3.5 py-2 rounded-2xl font-bold transition-all flex items-center gap-1.5 glass-panel text-gray-300 hover:text-white">

        <span class="px-1.5 py-0.5 rounded bg-black/40 border border-white/20 text-gray-300">← / →</span> สลับประเภท
        <span class="px-1.5 py-0.5 rounded bg-black/40 border border-white/20 text-gray-300">C</span> พลุ

  <!-- MAIN CEREMONY STAGE CONTAINER -->

      <p class="text-sm font-semibold tracking-wide">กำลังเตรียมเวทีประกาศผลรางวัล Popular Vote...</p>

    <div class="flex items-center gap-2 font-medium">

  <!-- SCRIPT -->
  <script>
    // ==========================================
    // State & Configurations
    // ==========================================
    let summaryData = null;
    let previousScores = {};
    let isSoundEnabled = true;
    let audioCtx = null;
    let pollingTimer = null;
    const POLLING_INTERVAL_MS = 2500;

    // Ordered sequence of categories for ceremony announcement:
    // 1. Miss Jumbo -> 2. Miss Queen -> 3. Mister -> 4. Miss -> 5. All Summary
    const CEREMONY_SEQUENCE = ['jumbo', 'queen', 'mister', 'miss', 'all'];
    let currentSequenceIndex = 0; // Starts at Miss Jumbo (index 0)

    // Track reveal status per category (false = mystery silhouette, true = winner revealed)
    const categoryRevealedState = {
      jumbo: false,
      queen: false,
      mister: false,
      miss: false,
      all: true // all overview is always revealed
    };

    const CATEGORIES_CONFIG = {
      jumbo: { name: 'Miss Jumbo RMUTK', short: 'Miss Jumbo', icon: 'fa-gem', color: 'amber', badge: 'bg-amber-500/20 text-amber-300 border-amber-500/40', titleColor: 'text-amber-400' },
      queen: { name: 'Miss Queen RMUTK', short: 'Miss Queen', icon: 'fa-crown', color: 'purple', badge: 'bg-purple-500/20 text-purple-300 border-purple-500/40', titleColor: 'text-purple-400' },
      mister: { name: 'Mister RMUTK', short: 'Mister', icon: 'fa-male', color: 'blue', badge: 'bg-blue-500/20 text-blue-300 border-blue-500/40', titleColor: 'text-blue-400' },
      miss: { name: 'Miss RMUTK', short: 'Miss', icon: 'fa-female', color: 'pink', badge: 'bg-pink-500/20 text-pink-300 border-pink-500/40', titleColor: 'text-pink-400' }
    };

    function getPlaceholderSvgUri(text) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <rect width="100%" height="100%" fill="#091054"/>
        <circle cx="100" cy="80" r="32" fill="#5478FF" opacity="0.35"/>
        <circle cx="100" cy="72" r="18" fill="#FFDE42" opacity="0.85"/>
        <path d="M65 125 Q100 95 135 125" fill="none" stroke="#FFDE42" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
        <text x="50%" y="165" dominant-baseline="middle" text-anchor="middle" fill="#FFDE42" font-family="sans-serif" font-weight="900" font-size="22">${text}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    // ==========================================
    // Confetti Fireworks (Canvas Particle Burst)
    // ==========================================
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#FFDE42', '#F59E0B', '#F43F5E', '#EC4899', '#3B82F6', '#10B981', '#FFFFFF', '#FFD700'];

      for (let i = 0; i < 200; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 300,
          y: canvas.height * 0.55,
          vx: (Math.random() - 0.5) * 28,
          vy: -Math.random() * 22 - 9,
          size: Math.random() * 9 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 16,
          gravity: 0.55,
          opacity: 1
        });
      }

      let animationFrame;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeCount = 0;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= 0.98;
          p.rotation += p.vRot;
          if (p.y > canvas.height * 0.3) {
            p.opacity -= 0.0075;
          }

          if (p.opacity > 0 && p.y < canvas.height + 50) {
            activeCount++;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
            ctx.restore();
          }
        });

        if (activeCount > 0) {
          animationFrame = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(animationFrame);
        }
      }

      animate();
    }

    // ==========================================
    // Web Audio Synthesizer (Fanfare & Victory Chime)
    // ==========================================
    function playFanfare() {
      if (!isSoundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const notes = [
          { f: 523.25, t: 0, d: 0.14 },    // C5
          { f: 659.25, t: 0.15, d: 0.14 }, // E5
          { f: 783.99, t: 0.30, d: 0.18 }, // G5
          { f: 1046.50, t: 0.50, d: 0.8 }  // High C6
        ];
        const now = audioCtx.currentTime;
        notes.forEach(n => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, now + n.t);
          gain.gain.setValueAtTime(0.28, now + n.t);
          gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + n.t);
          osc.stop(now + n.t + n.d);
        });
      } catch (e) {}
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const icon = document.getElementById('sound-icon');
      if (isSoundEnabled) {
        icon.className = 'fas fa-volume-up text-[#FFDE42]';
        playFanfare();
      } else {
        icon.className = 'fas fa-volume-mute text-gray-500';
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // ==========================================
    // Sequence Stepper Navigation (ก่อนหน้า - ถัดไป)
    // ==========================================
    function setCategoryIndex(idx) {
      currentSequenceIndex = Math.max(0, Math.min(CEREMONY_SEQUENCE.length - 1, idx));
      updateTabStyles();
      updateStepperUI();
      renderCeremonyDisplay();
    }

    function stepCategory(direction) {
      const newIdx = currentSequenceIndex + direction;
      if (newIdx >= 0 && newIdx < CEREMONY_SEQUENCE.length) {
        setCategoryIndex(newIdx);
      }
    }

    function updateStepperUI() {
      const catKey = CEREMONY_SEQUENCE[currentSequenceIndex];
      const ind = document.getElementById('step-indicator');
      const revBtn = document.getElementById('btn-toggle-reveal');
      const revLabel = document.getElementById('reveal-btn-label');
      const revIcon = document.getElementById('reveal-icon');

      if (catKey === 'all') {
        if (ind) ind.innerText = '5/5 • สรุปรวม 4 ประเภท';
        if (revBtn) revBtn.classList.add('hidden');
      } else {
        const config = CATEGORIES_CONFIG[catKey];
        if (ind) ind.innerText = `${currentSequenceIndex + 1}/5 • ${config.short}`;
        if (revBtn) revBtn.classList.remove('hidden');

        const isRev = categoryRevealedState[catKey];
        if (isRev) {
          revLabel.innerText = 'ซ่อนคะแนน (ปิดม่าน)';
          revIcon.className = 'fas fa-eye-slash text-gray-200';
          revBtn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 bg-gray-700 hover:bg-gray-600 text-gray-200 active:scale-95';
        } else {
          revLabel.innerText = 'เฉลยผู้ชนะ (Space)';
          revIcon.className = 'fas fa-magic text-yellow-300';
          revBtn.className = 'px-4 py-2 rounded-xl text-xs font-black transition flex items-center gap-1.5 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white shadow-lg active:scale-95 animate-pulse';
        }
      }
    }

    function updateTabStyles() {
      document.querySelectorAll('.cat-tab').forEach(b => {
        b.className = 'cat-tab px-3.5 py-2 rounded-2xl font-bold transition-all flex items-center gap-1.5 glass-panel text-gray-300 hover:text-white';
      });

      const catKey = CEREMONY_SEQUENCE[currentSequenceIndex];
      const activeBtn = document.getElementById(`cat-tab-${catKey}`);
      if (activeBtn) {
        activeBtn.className = 'cat-tab px-4 py-2 rounded-2xl font-black transition-all flex items-center gap-1.5 bg-[#FFDE42] text-[#050A30] shadow-[0_0_15px_rgba(255,222,66,0.5)]';
      }
    }

    // ==========================================
    // Reveal / Suspense Controller
    // ==========================================
    function toggleCurrentCategoryReveal() {
      const catKey = CEREMONY_SEQUENCE[currentSequenceIndex];
      if (catKey === 'all') return;

      const currentRev = categoryRevealedState[catKey];
      categoryRevealedState[catKey] = !currentRev;

      if (!currentRev) {
        // Trigger celebration fanfare and confetti burst on reveal!
        launchConfetti();
        playFanfare();
      }

      updateStepperUI();
      renderCeremonyDisplay();
    }

    // ==========================================
    // Data Fetching & Sync
    // ==========================================
    async function fetchLiveData() {
      try {
        const res = await fetch('/api/summary?t=' + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        summaryData = data;

        document.getElementById('last-updated').innerText = new Date().toLocaleTimeString('th-TH');
        renderCeremonyDisplay();
      } catch (err) {
        console.error('Fetch error:', err);
      }
    }

    // ==========================================
    // Render Dispatcher
    // ==========================================
    function renderCeremonyDisplay() {
      const container = document.getElementById('ceremony-content');
      if (!container) return;

      if (!summaryData || !summaryData.categories) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-24 text-gray-400">
            <i class="fas fa-spinner fa-spin text-4xl text-[#FFDE42] mb-3"></i>
            <p class="text-sm font-semibold tracking-wide">กำลังเชื่อมต่อฐานข้อมูล...</p>
          </div>`;
        return;
      }

      const activeKey = CEREMONY_SEQUENCE[currentSequenceIndex];

      if (activeKey === 'all') {
        renderAllCategoriesView(container);
      } else {
        renderSingleCeremonySpotlight(container, activeKey);
      }
    }

    // ==========================================
    // 🌟 View 1: Spotlight Single Category Ceremony (ทีละประเภท)
    // ==========================================
    function renderSingleCeremonySpotlight(container, catKey) {
      const config = CATEGORIES_CONFIG[catKey];
      const rawList = summaryData.categories[catKey] || [];
      const list = [...rawList].sort((a, b) => {
        if (a.status === 'resigned' && b.status !== 'resigned') return 1;
        if (b.status === 'resigned' && a.status !== 'resigned') return -1;
        return (b.rounds?.popular?.total || 0) - (a.rounds?.popular?.total || 0);
      });

      const leader = list[0];
      const runner1 = list[1];
      const runner2 = list[2];
      const isRevealed = categoryRevealedState[catKey];

      // Next category name for preview
      const nextKey = CEREMONY_SEQUENCE[currentSequenceIndex + 1];
      const nextLabel = nextKey === 'all' ? 'สรุปรวม 4 ประเภท' : (CATEGORIES_CONFIG[nextKey]?.short || '');

      container.innerHTML = `
        <div class="max-w-4xl mx-auto w-full space-y-4">

          <!-- Category Banner Above Card -->
          <div class="text-center">
            <span class="inline-flex items-center gap-2 px-5 py-1.5 rounded-full text-xs md:text-sm font-black uppercase tracking-wider ${config.badge} shadow-lg">
              <i class="fas ${config.icon}"></i> การประกาศผลรางวัล: ${config.name}
            </span>
          </div>

          <!-- MAIN SPOTLIGHT STAGE CARD -->
          <div class="glass-panel rounded-3xl p-6 md:p-8 border-2 border-[#FFDE42] shadow-[0_0_60px_rgba(255,222,66,0.3)] relative overflow-hidden text-center transition-all">

            ${!isRevealed ? `
              <!-- ============================================== -->
              <!-- STATE A: MYSTERY / SUSPENSE (ก่อนเฉลย) -->
              <!-- ============================================== -->
              <div class="py-8 md:py-12 flex flex-col items-center justify-center animate-fadeIn">
                <!-- Glowing Mystery Aura -->
                <div class="relative w-44 h-56 md:w-52 md:h-64 rounded-3xl border-2 border-dashed border-[#FFDE42]/70 bg-gradient-to-b from-[#111FA2]/80 to-[#050A30] flex flex-col items-center justify-center shadow-[0_0_40px_rgba(255,222,66,0.35)] animate-mystery mb-5">
                  <div class="w-20 h-20 rounded-full bg-[#FFDE42]/20 flex items-center justify-center text-4xl text-[#FFDE42] mb-2 shadow-inner">
                    <i class="fas fa-question"></i>
                  </div>
                  <div class="text-xs uppercase font-black tracking-widest text-[#FFDE42]">MYSTERY WINNER</div>
                </div>

                <div class="text-xl md:text-2xl font-black text-white gold-glow mb-2">
                  ✦ ผู้ได้รับรางวัลชนะเลิศ POPULAR VOTE ✦
                </div>
                <div class="text-sm md:text-base font-bold ${config.titleColor} mb-6">
                  ${config.name}
                </div>

                <!-- Big Call-to-Action Reveal Button -->
                <button type="button" onclick="toggleCurrentCategoryReveal()"
                  class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-[#FFDE42] via-yellow-300 to-[#FFDE42] text-[#050A30] font-black text-sm md:text-base shadow-[0_0_30px_rgba(255,222,66,0.7)] hover:scale-105 active:scale-95 transition flex items-center gap-2">
                  <i class="fas fa-magic text-rose-600"></i>
                  <span>กดเฉลยผู้ชนะรางวัลบนเวที (Spacebar)</span>
                </button>
              </div>
            ` : `
              <!-- ============================================== -->
              <!-- STATE B: REVEALED / CELEBRATION (เปิดม่านเฉลย) -->
              <!-- ============================================== -->
              ${leader ? `
                <div class="animate-pop-in flex flex-col items-center">
                  <!-- Crown Badge -->
                  <div class="inline-flex items-center gap-2 px-5 py-1 rounded-full bg-[#050A30] border-2 border-[#FFDE42] text-xs md:text-sm font-black text-[#FFDE42] shadow-[0_0_20px_rgba(255,222,66,0.5)] mb-3">
                    <i class="fas fa-crown text-amber-300"></i>
                    <span>THE WINNER • POPULAR VOTE</span>
                  </div>

                  <!-- Giant Winner Photo with Face Focus -->
                  <div class="relative w-48 h-64 md:w-56 md:h-72 mx-auto mb-4 rounded-3xl overflow-hidden border-4 border-[#FFDE42] shadow-[0_0_50px_rgba(255,222,66,0.6)] bg-[#050A30]">
                    <img src="/api/contestants/${encodeURIComponent(leader.id)}/image" onerror="this.onerror=null; this.src=getPlaceholderSvgUri('${leader.id}');"
                      class="w-full h-full object-cover transition-transform duration-500 hover:scale-105"
                      style="object-position: center 10%;">
                    <span class="absolute bottom-2 right-2 px-3.5 py-1 rounded-xl bg-[#050A30]/90 border-2 border-[#FFDE42] text-sm md:text-base font-black text-[#FFDE42] shadow-xl">
                      ${leader.id}
                    </span>
                  </div>

                  <!-- Contestant Names -->
                  <h2 class="text-2xl md:text-3xl font-black text-white tracking-wide">${leader.name}</h2>
                  ${leader.nickname ? `<div class="text-sm md:text-base text-amber-300 font-bold mt-0.5">"${leader.nickname}"</div>` : ''}
                  <div class="text-xs md:text-sm text-gray-300 mt-1">${leader.faculty || ''}</div>

                  <!-- Huge Score Display -->
                  <div class="mt-5 bg-gradient-to-r from-[#111FA2]/90 via-[#091054]/95 to-[#111FA2]/90 px-8 py-3.5 rounded-2xl border-2 border-[#FFDE42]/60 shadow-[0_0_30px_rgba(255,222,66,0.35)] min-w-[280px]">
                    <div class="text-[11px] uppercase font-bold tracking-widest text-rose-300 flex items-center justify-center gap-1.5">
                      <i class="fas fa-heart text-rose-400"></i> คะแนน POPULAR VOTE รวม
                    </div>
                    <div class="text-4xl md:text-5xl font-black text-[#FFDE42] gold-glow my-0.5 score-updated">
                      ${(leader.rounds?.popular?.total || 0).toLocaleString()}
                    </div>
                    <div class="text-xs text-gray-400">คะแนนโหวตอย่างเป็นทางการ</div>
                  </div>

                  <!-- Runners-up Strip (รองอันดับ 1 และ 2) -->
                  <div class="mt-6 pt-4 border-t border-white/10 w-full max-w-xl flex flex-wrap items-center justify-center gap-3 text-xs text-gray-300">
                    ${runner1 ? `
                      <div class="flex items-center gap-2 bg-[#091054]/80 px-3.5 py-1.5 rounded-xl border border-slate-400/30">
                        <span class="text-slate-300 font-black">🥈 รองอันดับ 1:</span>
                        <span class="text-white font-bold">${runner1.id} ${runner1.nickname || runner1.name}</span>
                        <span class="font-black text-rose-300">(${(runner1.rounds?.popular?.total || 0).toLocaleString()} คะแนน)</span>
                      </div>` : ''}
                    ${runner2 ? `
                      <div class="flex items-center gap-2 bg-[#091054]/80 px-3.5 py-1.5 rounded-xl border border-amber-500/30">
                        <span class="text-amber-400 font-black">🥉 รองอันดับ 2:</span>
                        <span class="text-white font-bold">${runner2.id} ${runner2.nickname || runner2.name}</span>
                        <span class="font-black text-rose-300">(${(runner2.rounds?.popular?.total || 0).toLocaleString()} คะแนน)</span>
                      </div>` : ''}
                  </div>
                </div>
              ` : '<div class="py-16 text-center text-gray-400">ยังไม่มีข้อมูล</div>'}
            `}

          </div>

          <!-- Bottom Navigation Shortcut Bar -->
          <div class="flex items-center justify-between text-xs px-2 pt-1 text-gray-400">
            <button type="button" onclick="stepCategory(-1)" class="hover:text-white flex items-center gap-1.5 font-bold">
              <i class="fas fa-arrow-left text-[#FFDE42]"></i>
              <span>ประเภทย้อนหลัง</span>
            </button>
            <div class="text-center text-[11px]">
              คิวถัดไป: <span class="font-bold text-[#FFDE42]">${nextLabel}</span>
            </div>
            <button type="button" onclick="stepCategory(1)" class="hover:text-white flex items-center gap-1.5 font-bold">
              <span>ไปประเภทถัดไป</span>
              <i class="fas fa-arrow-right text-[#FFDE42]"></i>
            </button>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 🌟 View 2: All 4 Winners Grand Showcase (สรุปรวม 4 ประเภท)
    // ==========================================
    function renderAllCategoriesView(container) {
      const keys = ['jumbo', 'queen', 'mister', 'miss'];

      container.innerHTML = `
        <div class="space-y-4 animate-fadeIn">
          <!-- Page Header -->
          <div class="text-center mb-1">
            <span class="inline-flex items-center gap-2 px-5 py-1.5 rounded-full text-xs md:text-sm font-black uppercase tracking-widest bg-gradient-to-r from-[#FFDE42]/20 via-rose-500/20 to-[#FFDE42]/20 border border-[#FFDE42]/50 text-amber-300 shadow">
              <i class="fas fa-award text-[#FFDE42]"></i> 🏆 สรุปผลผู้ชนะ POPULAR VOTE ทั้ง 4 ประเภท
            </span>
          </div>

          <!-- 4 Categories Winners Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5 items-stretch">
            ${keys.map(catKey => {
              const config = CATEGORIES_CONFIG[catKey];
              const rawList = summaryData.categories[catKey] || [];
              const list = [...rawList].sort((a, b) => {
                if (a.status === 'resigned' && b.status !== 'resigned') return 1;
                if (b.status === 'resigned' && a.status !== 'resigned') return -1;
                return (b.rounds?.popular?.total || 0) - (a.rounds?.popular?.total || 0);
              });

              const leader = list[0];
              const runner1 = list[1];
              const runner2 = list[2];
              const popScore = leader?.rounds?.popular?.total || 0;

              return `
                <div class="relative glass-panel rounded-3xl p-5 flex flex-col justify-between border-2 border-[#FFDE42]/60 shadow-[0_0_35px_rgba(255,222,66,0.25)] hover:border-[#FFDE42] transition-all duration-500 hover:scale-[1.02]">
                  <!-- Top Badge -->
                  <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-2">
                    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-black uppercase ${config.badge}">
                      <i class="fas ${config.icon}"></i> ${config.name}
                    </span>
                    <button type="button" onclick="setCategoryIndex(${CEREMONY_SEQUENCE.indexOf(catKey)})"
                      class="text-[11px] text-[#FFDE42] hover:text-white font-bold underline">
                      สปอตไลต์
                    </button>
                  </div>

                  <!-- Winner Content -->
                  ${leader ? `
                    <div class="text-center flex-1 flex flex-col justify-between">
                      <div>
                        <!-- Crown Badge -->
                        <div class="inline-flex items-center gap-1 px-3 py-0.5 rounded-full bg-[#050A30] border border-[#FFDE42] text-[10px] font-black text-[#FFDE42] shadow mb-2">
                          👑 อันดับ 1 WINNER
                        </div>

                        <!-- Large Photo -->
                        <div class="relative w-36 h-48 md:w-40 md:h-52 mx-auto mb-2.5 rounded-2xl overflow-hidden border-2 border-[#FFDE42] shadow-[0_0_25px_rgba(255,222,66,0.4)] bg-[#050A30]">
                          <img src="/api/contestants/${encodeURIComponent(leader.id)}/image" onerror="this.onerror=null; this.src=getPlaceholderSvgUri('${leader.id}');"
                            class="w-full h-full object-cover"
                            style="object-position: center 10%;">
                          <span class="absolute bottom-1.5 right-1.5 px-2.5 py-0.5 rounded-lg bg-[#050A30]/90 border border-[#FFDE42] text-xs font-black text-[#FFDE42] shadow">
                            ${leader.id}
                          </span>
                        </div>

                        <!-- Names -->
                        <div class="text-sm font-black text-white line-clamp-1">${leader.name}</div>
                        ${leader.nickname ? `<div class="text-xs text-amber-300 font-bold mt-0.5">"${leader.nickname}"</div>` : ''}
                        <div class="text-[10px] text-gray-300 line-clamp-1 mt-0.5">${leader.faculty || ''}</div>
                      </div>

                      <div>
                        <!-- Score Display -->
                        <div class="mt-3.5 pt-2.5 border-t border-white/10 bg-[#091054]/80 p-2.5 rounded-2xl border border-[#5478FF]/30">
                          <div class="text-[9px] uppercase font-bold text-rose-300">คะแนน POPULAR VOTE</div>
                          <div class="text-2xl md:text-3xl font-black text-[#FFDE42] gold-glow my-0.5">
                            ${popScore.toLocaleString()}
                          </div>
                          <div class="text-[9px] text-gray-400">คะแนน</div>
                        </div>

                        <!-- Mini Runners-up Footer -->
                        <div class="mt-2.5 pt-2 text-[10px] text-gray-300 flex flex-col gap-1 border-t border-white/5 text-left">
                          ${runner1 ? `
                            <div class="flex items-center justify-between bg-black/25 px-2 py-1 rounded-lg">
                              <span class="truncate"><span class="text-slate-300 font-bold">#2</span> ${runner1.id} ${runner1.nickname || runner1.name}</span>
                              <span class="font-bold text-rose-300 shrink-0">${(runner1.rounds?.popular?.total || 0).toLocaleString()}</span>
                            </div>` : ''}
                          ${runner2 ? `
                            <div class="flex items-center justify-between bg-black/25 px-2 py-1 rounded-lg">
                              <span class="truncate"><span class="text-amber-400 font-bold">#3</span> ${runner2.id} ${runner2.nickname || runner2.name}</span>
                              <span class="font-bold text-rose-300 shrink-0">${(runner2.rounds?.popular?.total || 0).toLocaleString()}</span>
                            </div>` : ''}
                        </div>
                      </div>
                    </div>
                  ` : '<div class="py-16 text-center text-xs text-gray-400">ยังไม่มีข้อมูล</div>'}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // Keyboard Shortcuts for Stage Operator
    // ==========================================
    document.addEventListener('keydown', (e) => {
      // Ignore if user is inside an input box
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        toggleCurrentCategoryReveal();
      } else if (e.code === 'ArrowRight' || e.code === 'KeyN') {
        e.preventDefault();
        stepCategory(1);
      } else if (e.code === 'ArrowLeft' || e.code === 'KeyP') {
        e.preventDefault();
        stepCategory(-1);
      } else if (e.code === 'KeyC') {
        launchConfetti();
      } else if (e.code === 'KeyF') {
        toggleFullScreen();
      }
    });

    // ==========================================
    // Init & Lifecycle
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      fetchLiveData();
      updateTabStyles();
      updateStepperUI();
      pollingTimer = setInterval(fetchLiveData, POLLING_INTERVAL_MS);
    });
  </script>
</body>

</html>

<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMUTK FRESHY 2026 - POPULAR VOTE CEREMONY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="shortcut icon" type="image/png" href="images/logo.png" />

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      box-sizing: border-box;
    }

    body {
      font-family: "Prompt", sans-serif;
      background-color: #050a30;
      background-image:
        radial-gradient(circle at 50% 10%, rgba(84, 120, 255, 0.38) 0%, transparent 60%),
        radial-gradient(circle at 10% 85%, rgba(244, 63, 94, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 90% 85%, rgba(255, 222, 66, 0.25) 0%, transparent 50%);
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .glass-panel {
      background: rgba(13, 24, 120, 0.5);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(84, 120, 255, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    .gold-glow {
      text-shadow:
        0 0 15px rgba(255, 222, 66, 0.9),
        0 0 35px rgba(255, 180, 0, 0.6);
    }

    .pulse-live {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-ring 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      70% { opacity: 1; transform: scale(1.03) translateY(-5px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .animate-pop-in {
      animation: popIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulseMystery {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 222, 66, 0.35)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 50px rgba(255, 222, 66, 0.85)); }
    }

    .animate-mystery {
      animation: pulseMystery 2.5s infinite ease-in-out;
    }

    /* ==========================================
       ROYAL STAGE CEREMONY EFFECTS (LUXURY GOLD)
       ========================================== */
    @keyframes rotateRays {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .god-rays {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1000px;
      height: 1000px;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 222, 66, 0.08) 0deg 12deg,
        transparent 12deg 24deg
      );
      border-radius: 50%;
      pointer-events: none;
      animation: rotateRays 45s linear infinite;
      mask-image: radial-gradient(circle, rgba(0,0,0,0.85) 20%, transparent 68%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,0.85) 20%, transparent 68%);
      z-index: 0;
    }

    @keyframes goldSheen {
      0% { transform: translateX(-150%) skewX(-25deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateX(250%) skewX(-25deg); opacity: 0; }
    }

    .shimmer-card {
      position: relative;
      overflow: hidden;
    }

    .shimmer-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 222, 66, 0.15) 30%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 222, 66, 0.15) 70%,
        transparent 100%
      );
      pointer-events: none;
      animation: goldSheen 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
      z-index: 20;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(0.9) rotate(0deg); opacity: 0.7; }
      50% { transform: scale(1.15) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 10px rgba(255, 222, 66, 0.9)); }
    }

    .star-sparkle {
      display: inline-block;
      animation: starPulse 2.2s infinite ease-in-out;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 select-none relative">

  <!-- ======================================================= -->
  <!-- 3. MAIN CEREMONY STAGE CONTAINER (ผู้ชมจะเห็นเฉพาะผลอันดับ 1 เท่านั้น ไม่แสดงอันดับรอง) -->

  <!-- SCRIPT -->
  <script>
    // ==========================================
    // State & Configurations (No Sound)
    // ==========================================
    let summaryData = null;
    let lastConfettiTrigger = 0;
    let localCategory = 'winner';
    let localRevealed = false;
    let isAdminActive = false;

    const ORDER = ['winner', 'jumbo', 'queen', 'congeniality', 'mister', 'miss', 'all'];

    const CATEGORIES_CONFIG = {
      jumbo: { name: 'Miss Jumbo RMUTK', icon: 'fa-gem', badge: 'bg-amber-500/20 text-amber-300 border-amber-500/40', titleColor: 'text-amber-400' },
      queen: { name: 'Miss Queen RMUTK', icon: 'fa-crown', badge: 'bg-purple-500/20 text-purple-300 border-purple-500/40', titleColor: 'text-purple-400' },
      congeniality: { name: 'Miss Congeniality RMUTK (Miss Con)', icon: 'fa-star', badge: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40', titleColor: 'text-emerald-400' },
      mister: { name: 'Mister RMUTK', icon: 'fa-male', badge: 'bg-blue-500/20 text-blue-300 border-blue-500/40', titleColor: 'text-blue-400' },
      miss: { name: 'Miss RMUTK', icon: 'fa-female', badge: 'bg-pink-500/20 text-pink-300 border-pink-500/40', titleColor: 'text-pink-400' }
    };

    function getPlaceholderSvgUri(text) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <rect width="100%" height="100%" fill="#091054"/>
        <circle cx="100" cy="80" r="32" fill="#5478FF" opacity="0.35"/>
        <circle cx="100" cy="72" r="18" fill="#FFDE42" opacity="0.85"/>
        <path d="M65 125 Q100 95 135 125" fill="none" stroke="#FFDE42" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
        <text x="50%" y="165" dominant-baseline="middle" text-anchor="middle" fill="#FFDE42" font-family="sans-serif" font-weight="900" font-size="22">${text}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    // ==========================================
    // Royal Golden Celebration Effect (Luxury Gold Stardust, Diamond Sparkles & Shockwave)
    // ==========================================
    let activeCelebrationAnim = null;

    function launchCelebrationEffect() {
      const canvas = document.getElementById('celebration-canvas') || document.getElementById('confetti-canvas');
      if (!canvas) return;

      if (activeCelebrationAnim) {
        cancelAnimationFrame(activeCelebrationAnim);
        activeCelebrationAnim = null;
      }

      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.45;

      // 1. Concentric Golden Shockwave Rings (คลื่นวงแหวนแสงสีทองขยายตัว)
      const rings = [
        { radius: 40, maxRadius: Math.max(canvas.width, canvas.height) * 0.65, speed: 18, opacity: 0.9, width: 6, delay: 0 },
        { radius: 20, maxRadius: Math.max(canvas.width, canvas.height) * 0.55, speed: 14, opacity: 0.7, width: 4, delay: 12 },
        { radius: 10, maxRadius: Math.max(canvas.width, canvas.height) * 0.45, speed: 10, opacity: 0.5, width: 3, delay: 24 }
      ];

      // 2. Diamond Glint Stars (✦ ประกายเพชรวิบวับลอยละล่อง)
      const diamondStars = [];
      const starColors = ['#FFFFFF', '#FFDE42', '#FFEAA7', '#FDE047', '#FFF3BF'];
      for (let i = 0; i < 55; i++) {
        diamondStars.push({
          x: centerX + (Math.random() - 0.5) * Math.min(canvas.width * 0.7, 700),
          y: centerY + (Math.random() - 0.5) * 350,
          vx: (Math.random() - 0.5) * 2.2,
          vy: -Math.random() * 2.8 - 0.6,
          size: Math.random() * 11 + 6,
          rotation: Math.random() * Math.PI,
          vRot: (Math.random() - 0.5) * 0.05,
          color: starColors[Math.floor(Math.random() * starColors.length)],
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.08 + 0.04,
          life: 1.0,
          decay: Math.random() * 0.004 + 0.003
        });
      }

      // 3. Floating Golden Stardust / Champagne Bokeh Dust (ละอองดาวสีทองละมุน)
      const stardust = [];
      const goldTones = ['#FFDE42', '#F59E0B', '#FDE047', '#FFFFFF', '#D4AF37'];
      for (let i = 0; i < 90; i++) {
        stardust.push({
          x: centerX + (Math.random() - 0.5) * Math.min(canvas.width * 0.85, 900),
          y: centerY + Math.random() * 250 - 50,
          vx: (Math.random() - 0.5) * 1.6,
          vy: -Math.random() * 2.2 - 0.5,
          radius: Math.random() * 4 + 2,
          color: goldTones[Math.floor(Math.random() * goldTones.length)],
          phase: Math.random() * Math.PI * 2,
          life: 1.0,
          decay: Math.random() * 0.005 + 0.0035
        });
      }

      let frameCount = 0;

      function drawDiamondGlint(x, y, size, rot, opacity, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.globalAlpha = Math.max(0, opacity);

        // Subtle soft outer glow
        ctx.shadowColor = '#FFDE42';
        ctx.shadowBlur = 12;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.quadraticCurveTo(0, 0, size * 0.85, 0);
        ctx.quadraticCurveTo(0, 0, 0, size);
        ctx.quadraticCurveTo(0, 0, -size * 0.85, 0);
        ctx.quadraticCurveTo(0, 0, 0, -size);
        ctx.closePath();
        ctx.fill();

        // Brilliant diamond white core
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.22, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawGlowingDust(x, y, radius, opacity, color) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, opacity);
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.35, color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, radius * 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        frameCount++;
        let activeElements = 0;

        // Animate & Draw Shockwave Rings
        rings.forEach(r => {
          if (frameCount >= r.delay && r.opacity > 0.01) {
            activeElements++;
            r.radius += r.speed;
            r.speed *= 0.965;
            r.opacity -= 0.012;

            if (r.opacity > 0) {
              ctx.save();
              ctx.globalAlpha = Math.max(0, r.opacity);
              ctx.shadowColor = '#FFDE42';
              ctx.shadowBlur = 20;

              const ringGrad = ctx.createRadialGradient(centerX, centerY, Math.max(0, r.radius - 20), centerX, centerY, r.radius + 20);
              ringGrad.addColorStop(0, 'transparent');
              ringGrad.addColorStop(0.5, '#FFEAA7');
              ringGrad.addColorStop(0.8, '#FFDE42');
              ringGrad.addColorStop(1, 'transparent');

              ctx.strokeStyle = ringGrad;
              ctx.lineWidth = r.width;
              ctx.beginPath();
              ctx.arc(centerX, centerY, r.radius, 0, Math.PI * 2);
              ctx.stroke();
              ctx.restore();
            }
          }
        });

        // Animate & Draw Diamond Stars
        diamondStars.forEach(s => {
          if (s.life > 0.01) {
            activeElements++;
            s.x += s.vx;
            s.y += s.vy;
            s.vx *= 0.99;
            s.vy *= 0.995;
            s.rotation += s.vRot;
            s.life -= s.decay;

            const twinkle = (Math.sin(frameCount * s.twinkleSpeed + s.phase) + 1) * 0.35 + 0.3;
            const currentAlpha = Math.max(0, s.life * twinkle);

            drawDiamondGlint(s.x, s.y, s.size, s.rotation, currentAlpha, s.color);
          }
        });

        // Animate & Draw Glowing Stardust
        stardust.forEach(d => {
          if (d.life > 0.01) {
            activeElements++;
            d.x += d.vx;
            d.y += d.vy;
            d.vx += (Math.random() - 0.5) * 0.15;
            d.life -= d.decay;

            const twinkle = (Math.sin(frameCount * 0.06 + d.phase) + 1) * 0.4 + 0.2;
            const currentAlpha = Math.max(0, d.life * twinkle * 0.85);

            drawGlowingDust(d.x, d.y, d.radius, currentAlpha, d.color);
          }
        });

        if (activeElements > 0) {
          activeCelebrationAnim = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          cancelAnimationFrame(activeCelebrationAnim);
          activeCelebrationAnim = null;
        }
      }

      animate();
    }

    // Alias for full compatibility
    function launchConfetti() {
      launchCelebrationEffect();
    }

    // ==========================================
    // State Caching to Prevent Unnecessary Re-rendering (แก้ปัญหาป๊อปอัพรัวๆ)
    // ==========================================
    let lastRenderedState = {
      category: null,
      revealed: null,
      leaderId: null,
      leaderScore: null,
      allHash: null

    let isInitialSync = true;

    // ==========================================
    // Remote Stage State Sync (รับคำสั่งจากแอดมินอัตโนมัติ)
    // ==========================================
    let syncTickCount = 0;
    let isSyncing = false;
    async function syncRemoteState() {
      if (document.hidden) return; // หากย่อแท็บหรือเปิดแท็บอื่นอยู่ ให้หยุด sync ชั่วคราวเพื่อประหยัดทรัพยากร
      if (isSyncing) return;
      isSyncing = true;
      syncTickCount++;
      try {
        const needSummary = isInitialSync || !summaryData || (syncTickCount % 8 === 0);
        const fetchPromises = [fetch('/api/stage-state')];
        if (needSummary) {
          fetchPromises.push(fetch('/api/summary'));
        }

        const [stageRes, sumRes] = await Promise.all(fetchPromises);

        let stageChanged = false;
        if (stageRes && stageRes.ok) {
          const remoteState = await stageRes.json();

          if (isInitialSync) {
            localCategory = remoteState.category || 'jumbo';
            localRevealed = Boolean(remoteState.revealed);
            lastConfettiTrigger = remoteState.confettiTrigger || 0;
            isInitialSync = false;
            stageChanged = true;
          } else {
            if (remoteState.category && remoteState.category !== localCategory) {
              localCategory = remoteState.category;
              stageChanged = true;
            }

            if (remoteState.revealed !== undefined && remoteState.revealed !== localRevealed) {
              localRevealed = Boolean(remoteState.revealed);
              stageChanged = true;
              if (localRevealed) {
                launchConfetti();
              }
            }

            if (remoteState.confettiTrigger && remoteState.confettiTrigger > lastConfettiTrigger) {
              lastConfettiTrigger = remoteState.confettiTrigger;
              launchConfetti();
            }
          }

          if (stageChanged) {
            updateAdminBarUI();
          }
        }

        if (sumRes && sumRes.ok) {
          summaryData = await sumRes.json();
        } else if (stageChanged && !sumRes) {
          // หากสถานะเวทีเปลี่ยน แต่รอบนี้ไม่ได้ดึง summary ให้ดึง summary มาอัปเดตผลทันที
          const quickSum = await fetch('/api/summary');
          if (quickSum.ok) summaryData = await quickSum.json();
        }

        // เรียก render โดย renderCeremonyDisplay จะตรวจสอบเองว่าข้อมูลเปลี่ยนหรือไม่
        // ถ้าไม่เปลี่ยนจะไม่แตะต้อง DOM เลย ป้องกันการกระตุกหรือป๊อปอัพซ้ำๆ
        renderCeremonyDisplay();

        const indicator = document.getElementById('remote-indicator');
        if (indicator) {
          indicator.className = 'text-emerald-400';
          indicator.innerHTML = '<i class="fas fa-satellite-dish mr-1"></i> เชื่อมต่อรีโมตสด';
        }
      } catch (err) {
        console.warn('Sync warning:', err);
        const indicator = document.getElementById('remote-indicator');
        if (indicator) {
          indicator.className = 'text-rose-400';
          indicator.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> ขาดการเชื่อมต่อ';
        }
      } finally {
        isSyncing = false;
      }
    }

              const rawList = summaryData.categories[catKey] || [];
              const list = [...rawList].sort((a, b) => {
                if (a.status === 'resigned' && b.status !== 'resigned') return 1;
                if (b.status === 'resigned' && a.status !== 'resigned') return -1;
                return (b.rounds?.popular?.total || 0) - (a.rounds?.popular?.total || 0);
              });

              const leader = list[0];
              const popScore = leader?.rounds?.popular?.total || 0;
              const isWinner = Boolean(leader && winner && leader.id === winner.id && popScore > 0);

              return `
                <div class="relative glass-panel rounded-3xl p-5 flex flex-col justify-between transition-all ${isWinner ? 'border-4 border-[#FFDE42] shadow-[0_0_45px_rgba(255,222,66,0.55)] scale-105 z-10 bg-gradient-to-b from-[#111FA2]/90 to-[#050A30]' : 'border border-[#5478FF]/30 shadow-lg opacity-90'}">
                  <!-- Top Badge -->
                  <div class="text-center pb-3 border-b border-white/10 mb-3">
                    <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-xl text-xs font-black uppercase ${config.badge}">
                      <i class="fas ${config.icon}"></i> ${config.name}
                    </span>
                  </div>

                  <!-- Winner or Nominee Content -->
                  ${leader ? `
                    <div class="text-center flex-1 flex flex-col justify-between">
                      <div>
                        <!-- Crown Badge (เฉพาะคนชนะคนเดียวเท่านั้น) หรือ Nominee Badge -->
                        ${isWinner ? `
                          <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-[#FFDE42] text-[#050A30] border-2 border-white text-xs font-black shadow-[0_0_20px_rgba(255,222,66,0.8)] mb-2 animate-bounce">
                            <i class="fas fa-crown text-amber-900"></i> 👑 Winner Popular ${config.name}
                          </div>
                        ` : `
                          <div class="inline-flex items-center gap-1 px-3 py-0.5 rounded-full bg-[#050A30] border border-[#5478FF]/50 text-[10px] font-bold text-gray-300 shadow mb-2">
                            ⭐ Top Vote
                          </div>
                        `}

                        <!-- Large Photo -->
                        <div class="relative w-40 h-52 md:w-44 md:h-56 mx-auto mb-3 rounded-2xl overflow-hidden ${isWinner ? 'border-4 border-[#FFDE42] shadow-[0_0_30px_rgba(255,222,66,0.6)]' : 'border border-[#5478FF]/50 shadow-md'} bg-[#050A30]">
                          <img src="/api/contestants/${encodeURIComponent(leader.id)}/image" decoding="async" onerror="this.onerror=null; this.src=getPlaceholderSvgUri('${leader.id}');"
                            class="w-full h-full object-cover"
                            style="object-position: center 10%;">
                          <span class="absolute bottom-1.5 right-1.5 px-2.5 py-0.5 rounded-lg bg-[#050A30]/90 border ${isWinner ? 'border-[#FFDE42] text-[#FFDE42]' : 'border-[#5478FF] text-gray-200'} text-xs font-black shadow">
                            ${leader.id}
                          </span>
                        </div>

                        <!-- Names -->
                        <div class="text-sm md:text-base font-black text-white line-clamp-1">${leader.name}</div>
                        ${leader.nickname ? `<div class="text-xs text-amber-300 font-bold mt-0.5">"${leader.nickname}"</div>` : ''}
                        <div class="text-[10px] text-gray-300 line-clamp-1 mt-0.5">${leader.faculty || ''}</div>
                      </div>

                      <div>
                        <!-- Score Display -->
                        <div class="mt-4 pt-3 border-t border-white/10 ${isWinner ? 'bg-[#091054] border-2 border-[#FFDE42]/70 shadow' : 'bg-[#091054]/80 border border-[#5478FF]/30'} p-2.5 rounded-2xl">
                          <div class="text-[9px] uppercase font-bold ${isWinner ? 'text-amber-300' : 'text-rose-300'}">
                            ${isWinner ? `👑 Winner Popular (${config.name})` : 'คะแนน Top Vote รวม'}
                          </div>
                          <div id="all-score-${catKey}" class="text-2xl font-black ${isWinner ? 'text-[#FFDE42] gold-glow scale-105' : 'text-gray-100'} my-0.5">
                            ${popScore.toLocaleString()}
                          </div>
                          <div class="text-[9px] text-gray-300 flex items-center justify-center gap-1 mt-1 pt-1 border-t border-white/10 flex-wrap">
                            <span class="text-blue-300">ออนไลน์: ${(leader?.rounds?.popular?.score_c1 || 0).toLocaleString()}</span>
                            <span>•</span>
                            <span class="text-amber-300">รอบแรก: ${(leader?.rounds?.popular?.score_c2 || 0).toLocaleString()}</span>
                            <span>•</span>
                            <span class="text-purple-300">รอบสอง: ${(leader?.rounds?.popular?.score_c3 || 0).toLocaleString()}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  ` : '<div class="py-16 text-center text-xs text-gray-400">ยังไม่มีข้อมูล</div>'}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // Admin Control Actions (เฉพาะแอดมิน)
    // ==========================================
    function toggleAdminBar(show) {
      isAdminActive = show;
      const bar = document.getElementById('admin-control-bar');
      const audienceHdr = document.getElementById('audience-header');
      if (bar) {
        if (show) {
          bar.classList.remove('hidden');
          if (audienceHdr) audienceHdr.classList.add('hidden');
        } else {
          bar.classList.add('hidden');
          if (audienceHdr) audienceHdr.classList.remove('hidden');
        }
      }
      updateAdminBarUI();
    }

    function promptAdminLogin() {
      if (isAdminActive) {
        toggleAdminBar(false);
        return;
      }
      const pass = prompt('กรุณากรอกรหัสผ่านแอดมิน เพื่อเปิดแถบควบคุมจอเวที:');
      if (pass === '2026' || pass === 'admin2026' || pass === 'staff2026') {
        sessionStorage.setItem('stage_admin', 'true');
        toggleAdminBar(true);
      } else if (pass !== null) {
        alert('รหัสผ่านไม่ถูกต้อง');
      }
    }

    function updateAdminBarUI() {
      if (!isAdminActive) return;

      // Update Stepper Label
      const stepIdx = ORDER.indexOf(localCategory);
      const indicator = document.getElementById('admin-step-indicator');
      if (indicator) {
        const names = {
          winner: '👑 Winner Popular (1 เดียว)',
          jumbo: '1/5 • Top Vote Miss Jumbo',
          queen: '2/5 • Top Vote Miss Queen',
          congeniality: '3/5 • Top Vote Miss Con',
          mister: '4/5 • Top Vote Mister',
          miss: '5/5 • Top Vote Miss',
          all: '🏆 สรุป Top Vote ทั้ง 5'
        };
        indicator.textContent = names[localCategory] || '👑 Winner Popular (1 เดียว)';
      }

      // Update Reveal Button
      const revealBtn = document.getElementById('admin-reveal-btn');
      const revealIcon = document.getElementById('admin-reveal-icon');
      const revealText = document.getElementById('admin-reveal-text');
      if (revealBtn && revealIcon && revealText) {
        if (localRevealed) {
          revealBtn.className = 'px-3.5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white border border-emerald-400 text-xs font-bold transition flex items-center gap-1.5 active:scale-95 shadow-[0_0_15px_rgba(16,185,129,0.4)]';
          revealIcon.className = 'fas fa-eye text-yellow-300';
          revealText.textContent = 'เฉลยอยู่ (กดเพื่อปิดม่าน)';
        } else {
          revealBtn.className = 'px-3.5 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-gray-200 border border-white/20 text-xs font-bold transition flex items-center gap-1.5 active:scale-95 shadow';
          revealIcon.className = 'fas fa-eye-slash text-rose-400';
          revealText.textContent = 'ซ่อนคะแนน (ปิดม่าน)';
        }
      }

      // Update Category Tabs
      ORDER.forEach(k => {
        const tab = document.getElementById(`tab-${k}`);
        if (!tab) return;
        if (k === localCategory) {
          tab.className = 'cat-tab px-4 py-2 rounded-2xl text-xs font-black transition-all flex items-center gap-1.5 bg-[#FFDE42] text-[#050A30] shadow-[0_0_15px_rgba(255,222,66,0.4)]';
        } else {
          tab.className = 'cat-tab px-4 py-2 rounded-2xl text-xs font-bold transition-all flex items-center gap-1.5 bg-[#091054]/90 text-gray-300 hover:text-white border border-[#5478FF]/30';
        }
      });
    }

    async function sendRemoteCommand(patch) {
      try {
        await fetch('/api/stage-state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch)
        });
      } catch (err) {
        console.error('Send remote command failed:', err);
      }
    }

    async function adminStepCategory(direction) {
      const curIdx = ORDER.indexOf(localCategory);
      let nextIdx = curIdx + direction;
      if (nextIdx < 0) nextIdx = ORDER.length - 1;
      if (nextIdx >= ORDER.length) nextIdx = 0;

      localCategory = ORDER[nextIdx];
      localRevealed = false; // ปิดม่านอัตโนมัติเมื่อเปลี่ยนประเภท
      updateAdminBarUI();
      renderCeremonyDisplay();

      await sendRemoteCommand({ category: localCategory, revealed: false });
    }

    async function adminSelectCategory(catKey) {
      if (!ORDER.includes(catKey)) return;
      localCategory = catKey;
      localRevealed = false;
      updateAdminBarUI();
      renderCeremonyDisplay();

      await sendRemoteCommand({ category: localCategory, revealed: false });
    }

    async function adminToggleReveal() {
      localRevealed = !localRevealed;
      updateAdminBarUI();
      renderCeremonyDisplay();

      if (localRevealed) launchConfetti();
      await sendRemoteCommand({ revealed: localRevealed });
    }

    async function adminTriggerConfetti() {
      launchConfetti();
      await sendRemoteCommand({ triggerConfetti: true });
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // ==========================================
    // Keyboard Shortcuts for Operator (Optional Silent Control)
    // ==========================================
    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        adminToggleReveal();
      } else if (e.code === 'ArrowRight' || e.code === 'KeyN') {
        e.preventDefault();
        adminStepCategory(1);
      } else if (e.code === 'ArrowLeft' || e.code === 'KeyP') {
        e.preventDefault();
        adminStepCategory(-1);
      } else if (e.code === 'KeyC') {
        adminTriggerConfetti();
      } else if (e.ctrlKey && e.shiftKey && e.code === 'KeyA') {
        e.preventDefault();
        toggleAdminBar(!isAdminActive);
      }
    });

    // ==========================================
    // Init & Polling
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      // ตรวจสอบว่ามีสิทธิ์แอดมินหรือเปิดด้วย ?admin=1 หรือไม่
      const params = new URLSearchParams(window.location.search);
      if (params.get('admin') === '1' || params.get('admin') === 'true' || sessionStorage.getItem('stage_admin') === 'true') {
        isAdminActive = true;
        toggleAdminBar(true);
      }

      syncRemoteState();
      setInterval(syncRemoteState, 2500);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          syncRemoteState();
        }
      });
    });
  </script>
</body>

</html>
